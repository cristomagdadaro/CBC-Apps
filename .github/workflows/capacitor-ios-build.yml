name: Capacitor iOS Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - FormBuilder
  push:
    branches:
      - main
      - master
      - FormBuilder

permissions:
  contents: read

jobs:
  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS app for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: onecbc-ios-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 14
